# Маршруты стенда. Вынесены отдельным файлом, потому что подключаются ДВУМЯ
# server-блоками (http на 80 и https на 443) — дублировать их в двух местах
# значило бы однажды поправить только одно.
    # --- Бэкенд: API, панель продавца, фото товаров, PDF документов. ---
    location ~ ^/(app|admin|store|auth|driver|media|static|health)(/|$) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";

        # Ответ ассистента идёт потоком, а первый ход модели занимает до 25 с:
        # с буферизацией и минутными таймаутами чат обрывался бы на середине.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Приложение сборщика: статика Flutter web. ---
    location = /picker {
        return 301 $scheme://$http_host/picker/;
    }

    # Ни один файл сборки Flutter'а НЕ содержит хэша в имени: каждая пересборка
    # кладёт тот же `main.dart.js`, `flutter_bootstrap.js` и так далее. Пока
    # стенд открывали по IP, это сходило с рук — теперь перед nginx стоит
    # Cloudflare, и без заголовка он применяет свой дефолт для статики
    # (`max-age=14400`). Наступили 2026-09-11: после переезда на домен туннель
    # отдавал сборку сборщика ДВУХДНЕВНОЙ давности, со старым адресом бэкенда
    # внутри, — на диске и через nginx файл был свежий, а через домен приходил
    # `cf-cache-status: HIT`.
    #
    # `no-cache` — это не «не кэшировать», а «кэшировать, но каждый раз
    # спрашивать»: ETag и Last-Modified остаются, и неизменные файлы отдаются
    # как 304. Цена — один условный запрос на файл, зато пересборка видна сразу.
    location /picker/ {
        alias /usr/share/nginx/html/picker/;
        try_files $uri $uri/ /picker/index.html;
        add_header Cache-Control "no-cache";
    }

    # ВАЖНО: `no-cache` выше до браузера не доходит. Настройка зоны Cloudflare
    # «Browser Cache TTL» (4 часа) переписывает его в `max-age=14400`, и мобильный
    # браузер держал старый бандл, пока не открыть инкогнито (замер 2026-09-15:
    # nginx шлёт `no-cache`, через домен приходит `max-age=14400`). Нетронутым
    # Cloudflare пропускает только `no-store` — на нём и держится обновление.
    #
    # Оболочка, загрузчик и service worker — `no-store`: они маленькие и именно
    # они указывают, какой бандл грузить.
    location ~ ^/picker/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        alias /usr/share/nginx/html/picker/$1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Бандл с хэшем в имени (переименовывает scripts/deploy.sh): новая сборка —
    # новый URL, поэтому храним навсегда и не ревалидируем.
    location ~ ^/picker/(main\.[0-9a-f]+\.dart\.js)$ {
        alias /usr/share/nginx/html/picker/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Витрина покупателя. ---
    location / {
        proxy_pass http://storefront;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        # Чат покупателя стримится через прокси-роут витрины
        # (/api/assistant/stream) — здесь буферизация тоже недопустима.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
