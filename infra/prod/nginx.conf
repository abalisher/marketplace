# Единый вход стенда. Снаружи — http://95.47.96.14:8040 (провайдер NAT-ит 8040
# на 80). Сервисы разложены СУФФИКСАМИ пути, не портами:
#
#   /            → витрина покупателя (Next.js)
#   /app/        → панель продавца/админа (Medusa admin)
#   /picker/     → приложение сборщика (Flutter web, статика)
#   /store /admin /auth /driver /media /static /health → API бэкенда
#
# Витрина живёт в КОРНЕ, а панель — на своём родном /app: так ни Next.js
# basePath, ни admin.path в medusa-config менять не нужно, и ни один клиент не
# переучивается на новые префиксы API.

upstream backend {
    server backend:9000;
}

upstream storefront {
    server storefront:8000;
}

# HTTP отдаёт только редирект в HTTPS. Причина не в гигиене, а в том, что по
# незащищённому соединению стенд НЕ РАБОТАЕТ: в production и Medusa, и витрина
# ставят cookie с флагом Secure, поэтому по http не проходит ни вход в панель
# (`/auth/session` отвечает 200 без Set-Cookie), ни вход покупателя по телефону —
# и оба ломаются МОЛЧА, возвращая пользователя на форму входа. Плюс без
# защищённого контекста браузер не даёт микрофон. Лучше видимое предупреждение о
# сертификате, чем тихо неработающая авторизация.
#
# Порт в редиректе — ВНЕШНИЙ (4440): внутри nginx слушает 443, но наружу
# провайдер выводит 4440. `$host` берётся без порта, поэтому порт дописываем.
server {
    listen 80;
    server_name _;

    # /health оставлен доступным по http: это проверка живости для скриптов
    # развёртывания и мониторинга, cookie и микрофон ей не нужны.
    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
    }

    location / {
        return 301 https://$host:4440$request_uri;
    }
}

# HTTPS на 443 (снаружи — 4440). Нужен РАДИ ГОЛОСА: браузеры отдают
# `navigator.mediaDevices.getUserMedia` только в защищённом контексте, поэтому по
# http кнопки микрофона в чате не существует вовсе.
#
# Сертификат САМОПОДПИСАННЫЙ, с SAN на IP-адрес (Chrome отвергает сертификат без
# subjectAltName). Доверенный сертификат на голый IP получить нельзя: Let's
# Encrypt проверяет владение через порт 80 или 443, а наружу выведен только
# 8040/4440. Следствие для пользователя: при первом заходе браузер покажет
# предупреждение, нужно нажать «Дополнительно → Перейти». После этого контекст
# считается защищённым и микрофон работает.
#
# Альтернатива без предупреждений — сервис `tunnel` в docker-compose.yml
# (доверенный сертификат, но адрес меняется при перезапуске).
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/stand.crt;
    ssl_certificate_key /etc/nginx/tls/stand.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    server_name _;

    # Заявка юрлица уходит с учредительными документами (до 4 файлов по 3 МБ,
    # плюс накладные ИИ-приёмки) — дефолтного лимита nginx в 1 МБ не хватает.
    client_max_body_size 24m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/locations.conf;
}
