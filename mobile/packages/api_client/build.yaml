# Настройки кодогена моделей api_client (см. swagger_parser.yaml рядом).
#
# include_if_null: false — НЕ слать в теле запроса поля, которых у модели нет.
#
# ЗАЧЕМ. По умолчанию json_serializable пишет `"note": null` для любого пустого
# необязательного поля. Наши zod-валидаторы объявляют такие поля `.optional()`,
# то есть «может отсутствовать», но НЕ «может быть null», и отбивают запрос:
#   HTTP 400 Invalid request: Expected type: 'string' for field 'note', got: 'null'
# Из-за этого сборщик не мог отметить ни одной позиции из приложения —
# `POST /admin/assembly-tasks/:id/items/:item_id` падал на каждой отметке без
# комментария (найдено живой пробой на совместном прогоне 2026-09-06; экран
# покрывался фейк-репозиторием, и по сети этот вызов не выполнялся ни разу).
#
# Чинить на стороне бэкенда (принимать null как отсутствие) пришлось бы в каждом
# валидаторе каждого роута, который зовут мобильные клиенты, — и мина возвращалась
# бы с каждым новым необязательным полем. Здесь это одна настройка на весь пакет.
#
# ЦЕНА. Явный `null` теперь не отправить — «стереть значение, прислав null» этим
# клиентом нельзя. Наши роуты так не работают: очистка полей везде выражена
# отдельным значением или отдельным вызовом.
targets:
  $default:
    builders:
      json_serializable:
        options:
          include_if_null: false
