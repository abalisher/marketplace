name: ui_kit
description: "Design system: tokens (colors, typography, spacing) and shared widgets."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Шрифт дизайн-системы — IBM Plex Sans (полная казахская кириллица).
  # TTF бандлятся ассетами пакета (см. assets ниже): google_fonts находит их в
  # манифесте и НЕ ходит в сеть — работает офлайн и в скриншот-тестах гейта U.
  # (Изначально тянулся в рантайме; локальные .ttf были запланированы «при
  # переходе на офлайн-сборки» — понадобились раньше, для скриншотов T1.1.)
  google_fonts: ^6.2.1
  # QR для платёжного блока Kaspi (read-only отображение qr_payload).
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # TTF IBM Plex Sans (OFL) — google_fonts подхватывает их из манифеста ассетов
  # по имени файла (IBMPlexSans-<Variant>.ttf) вместо сетевой загрузки.
  assets:
    - assets/fonts/

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
